spring.application.name=netfliz-worker
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=8082
# Overriding bean definition
spring.main.allow-bean-definition-overriding=true
# file upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=600MB
spring.servlet.multipart.max-request-size=600MB
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
# Hibernate properties for main datasource
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
# =======================
# Producer
# =======================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.batch-size=16384
spring.kafka.producer.linger-ms=10
spring.kafka.producer.buffer-memory=33554432
spring.kafka.producer.compression-type=snappy
# Producer Properties
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.spring.json.type.mapping=videoView:com.netfliz.worker.model.event.VideoViewEvent,videoProgress:com.netfliz.worker.model.event.VideoProgressEvent,userActivity:com.netfliz.worker.model.event.UserActivityEvent,recommendation:com.netfliz.worker.model.event.RecommendationEvent,notification:com.netfliz.worker.model.event.NotificationEvent,payment:com.netfliz.worker.model.event.PaymentEvent,analytics:com.netfliz.worker.model.event.AnalyticsEvent
# =======================
# Consumer
# =======================
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.group-id=${spring.application.name}-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.fetch-min-size=1
spring.kafka.consumer.fetch-max-wait=500
# =======================
# Email Configuration
# =======================
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
# =======================
# RestTemplate Configuration
# =======================
rest.connection.timeout=5000
rest.read.timeout=5000
spring.kafka.consumer.max-poll-records=100
# Consumer Properties
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.netfliz.worker.model.event.BaseEvent
spring.kafka.consumer.properties.isolation.level=read_committed
spring.kafka.consumer.properties.spring.json.type.mapping=videoView:com.netfliz.worker.model.event.VideoViewEvent,videoProgress:com.netfliz.worker.model.event.VideoProgressEvent,userActivity:com.netfliz.worker.model.event.UserActivityEvent,recommendation:com.netfliz.worker.model.event.RecommendationEvent,notification:com.netfliz.worker.model.event.NotificationEvent,payment:com.netfliz.worker.model.event.PaymentEvent,analytics:com.netfliz.worker.model.event.AnalyticsEvent
# =======================
# Listener
# =======================
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.concurrency=3
spring.kafka.listener.poll-timeout=3000
spring.kafka.listener.type=batch
# =======================
# Custom Kafka Configuration
# =======================
# Topics
kafka.topics.update-movie-asset=update-movie-asset-topic
kafka.topics.video-view=video-view-events
kafka.topics.user-activity=user-activity-events
kafka.topics.recommendation=recommendation-events
kafka.topics.notification=notification-events
kafka.topics.video-progress=video-progress-events
kafka.topics.payment=payment-events
kafka.topics.analytics=analytics-events
# Concurrency
kafka.concurrency.video-view=3
kafka.concurrency.user-activity=3
kafka.concurrency.recommendation=3
kafka.concurrency.notification=5
kafka.concurrency.video-progress=2
kafka.concurrency.payment=1
kafka.concurrency.analytics=5
# Retry
kafka.retry.max-attempts=3
kafka.retry.backoff-ms=1000
# Default
kafka.default.partitions=3
kafka.default.replication-factor=1
kafka.default.min-insync-replicas=1
# =======================
# Logging
# =======================
logging.level.root=INFO
logging.level.com.netfliz=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=WARN
logging.level.com.moviestreaming=DEBUG